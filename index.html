<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages SPA fallback (inverse of 404.html): /<repo>/?/admin  ->  /<repo>/admin
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&'); }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script>
      // Apply the saved or system colour theme before first paint (no flash). Mirrors src/lib/theme.ts.
      (function () {
        var t = null;
        try { var v = window.localStorage.getItem('aos-theme'); if (v === 'light' || v === 'dark') t = v; } catch (e) {}
        if (!t) { try { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { t = 'light'; } }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Bible Verse — AlphaOmega Studio</title>
    <meta name="description" content="Read one Bible verse each day, in English and Indian languages. Pick any date, like it and share it. By AlphaOmega Studio." />
    <meta name="theme-color" content="#FBF9F5" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="canonical" href="/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AlphaOmega Studio" />
    <meta property="og:title" content="Daily Bible Verse | AlphaOmega Studio" />
    <meta property="og:description" content="Find daily inspiration through the Word of God. Read, reflect, and share Bible verses every day." />
    <meta property="og:url" content="https://ashwithfrank.github.io/daily-bible-verse/" />
    <meta property="og:image" content="https://ashwithfrank.github.io/daily-bible-verse/og-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <noscript>This site needs JavaScript to show the daily verse.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
