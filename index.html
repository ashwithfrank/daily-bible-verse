<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages SPA fallback (inverse of 404.html): /<repo>/?/admin  ->  /<repo>/admin
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&'); }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Bible Verse — AlphaOmega Studio</title>
    <meta name="description" content="Read one Bible verse each day, in English and Indian languages. Pick any date, like it and share it. By AlphaOmega Studio." />
    <meta name="theme-color" content="#faf8f4" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="canonical" href="/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AlphaOmega Studio" />
    <meta property="og:title" content="Daily Bible Verse — AlphaOmega Studio" />
    <meta property="og:description" content="One Bible verse for every day." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site needs JavaScript to show the daily verse.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
